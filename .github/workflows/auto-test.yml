name: Auto Tests & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: datingapp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Run All Service Tests
      run: |
        echo "🧪 Testing all services..."
        TOTAL=0
        PASSED=0
        
        for test_proj in $(find . -name "*.Tests.csproj" | grep -v ".old_scaffolds" | grep -v "/bin/" | grep -v "/obj/"); do
          TOTAL=$((TOTAL+1))
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Testing: $test_proj"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if dotnet test "$test_proj" --verbosity minimal --no-build; then
            PASSED=$((PASSED+1))
            echo "✅ PASSED: $test_proj"
          else
            echo "❌ FAILED: $test_proj"
          fi
        done
        
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Summary: $PASSED/$TOTAL test projects passed"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        if [ $PASSED -lt $TOTAL ]; then
          exit 1
        fi
    
    - name: Generate Test Report
      if: always()
      run: |
        echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Date**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Services Tested**: Found test projects" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Tests complete" >> $GITHUB_STEP_SUMMARY

  api-smoke-tests:
    name: API Smoke Tests
    needs: backend-tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: pip install httpx pydantic python-dotenv
    
    - name: Run API Smoke Tests
      run: |
        echo "🧪 API smoke tests deferred until services can start in CI"
        echo "⏭️  Requires: Keycloak, MySQL, all services running"
        echo "✅ Placeholder passed"

  build-status:
    name: Build Status Summary
    needs: [backend-tests, api-smoke-tests]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Summary
      run: |
        echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- API Smoke Tests: ${{ needs.api-smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.backend-tests.result }}" == "success" ]; then
          echo "✅ **Build: PASSING**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build: FAILING**" >> $GITHUB_STEP_SUMMARY
        fi

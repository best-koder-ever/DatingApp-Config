name: "Commit Message Lint"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - '001-mvp-foundation'

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install commitlint
      run: |
        npm install -g @commitlint/cli@18 @commitlint/config-conventional@18

    - name: Validate current commit (push)
      if: github.event_name == 'push'
      run: echo "${{ github.event.head_commit.message }}" | npx commitlint
      continue-on-error: true

    - name: Validate PR commits
      if: github.event_name == 'pull_request'
      run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      continue-on-error: true

    - name: Comment on PR with format guide
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          const message = `## 📝 Commit Message Format

          Your commit messages should follow [Conventional Commits](https://www.conventionalcommits.org/):

          \`\`\`
          <type>[optional scope]: <description>

          [optional body]

          [optional footer(s)]
          \`\`\`

          **Types:**
          - \`feat:\` New feature (triggers minor version)
          - \`fix:\` Bug fix (triggers patch version)
          - \`docs:\` Documentation only
          - \`style:\` Code style (formatting, semicolons, etc)
          - \`refactor:\` Code restructuring
          - \`perf:\` Performance improvement
          - \`test:\` Adding/updating tests
          - \`chore:\` Maintenance tasks
          - \`ci:\` CI/CD changes

          **Examples:**
          \`\`\`
          feat(auth): add Google OAuth login
          fix(messaging): resolve SignalR connection timeout
          docs: update API documentation
          chore(deps): update NuGet packages
          \`\`\`

          **Breaking changes:** Add \`BREAKING CHANGE:\` in footer`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });

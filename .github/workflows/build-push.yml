name: Build & Push Docker Images

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mobile-apps/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: UserService
            path: UserService
            dockerfile: UserService/Dockerfile
          - name: MatchmakingService
            path: .
            dockerfile: MatchmakingService/Dockerfile
          - name: swipe-service
            path: swipe-service
            dockerfile: swipe-service/Dockerfile
          - name: photo-service
            path: photo-service
            dockerfile: photo-service/Dockerfile
          - name: messaging-service
            path: messaging-service
            dockerfile: messaging-service/Dockerfile
          - name: safety-service
            path: safety-service
            dockerfile: SafetyService/Dockerfile
          - name: bot-service
            path: bot-service
            dockerfile: BotService/Dockerfile
          - name: dejting-yarp
            path: dejting-yarp
            dockerfile: Dockerfile

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SERVICE_LOWER=$(echo "${{ matrix.service.name }}" | tr '[:upper:]' '[:lower:]')
          echo "service_lower=$SERVICE_LOWER" >> $GITHUB_OUTPUT

          # Tag based on branch or manual input
          if [ -n "${{ inputs.tag }}" ]; then
            BRANCH_TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BRANCH_TAG="stable"
          else
            BRANCH_TAG="${{ github.ref_name }}"
          fi
          echo "branch_tag=$BRANCH_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ steps.meta.outputs.service_lower }}:${{ steps.meta.outputs.branch_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ steps.meta.outputs.service_lower }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Comprehensive Dating App CI/CD Pipeline

on:
  push:
    branches: [main, develop, 001-mvp-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: best-koder-ever/dating-app
  DOTNET_VERSION: "8.0.x"

jobs:
  # ===== .NET MICROSERVICES BUILD & TEST =====
  dotnet-build-test:
    name: .NET Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [UserService, MatchmakingService, swipe-service, photo-service, messaging-service]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: datingapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - name: Checkout main repo
      uses: actions/checkout@v4
    
    - name: Checkout UserService
      uses: actions/checkout@v4
      with:
        repository: best-koder-org/UserService
        path: UserService
    
    - name: Checkout MatchmakingService
      uses: actions/checkout@v4
      with:
        repository: best-koder-org/MatchmakingService
        path: MatchmakingService
    
    - name: Checkout swipe-service
      uses: actions/checkout@v4
      with:
        repository: best-koder-org/swipe-service
        path: swipe-service
    
    - name: Checkout photo-service
      uses: actions/checkout@v4
      with:
        repository: best-koder-org/photo-service
        path: photo-service
    
    - name: Checkout messaging-service
      uses: actions/checkout@v4
      with:
        repository: best-koder-org/messaging-service
        path: messaging-service
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ matrix.service }}-${{ hashFiles(format('{0}/**/*.csproj', matrix.service)) }}
        restore-keys: |
          ${{ runner.os }}-nuget-${{ matrix.service }}-
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: |
        cd ${{ matrix.service }}
        # Use explicit .csproj file to avoid ambiguity
        if [ "${{ matrix.service }}" = "UserService" ]; then
          dotnet restore UserService.csproj
        elif [ "${{ matrix.service }}" = "MatchmakingService" ]; then
          dotnet restore MatchmakingService.csproj
        elif [ "${{ matrix.service }}" = "swipe-service" ]; then
          dotnet restore SwipeService.csproj
        elif [ "${{ matrix.service }}" = "photo-service" ]; then
          dotnet restore PhotoService.csproj
        elif [ "${{ matrix.service }}" = "messaging-service" ]; then
          dotnet restore MessagingService.csproj
        else
          dotnet restore
        fi
    
    - name: Check code formatting
      run: |
        cd ${{ matrix.service }}
        dotnet format --verify-no-changes --severity warn || echo "::warning::Code formatting issues detected. Run 'dotnet format' locally."
    
    - name: Build
      run: |
        cd ${{ matrix.service }}
        # Use explicit .csproj file
        if [ "${{ matrix.service }}" = "UserService" ]; then
          dotnet build UserService.csproj --no-restore --configuration Release
        elif [ "${{ matrix.service }}" = "MatchmakingService" ]; then
          dotnet build MatchmakingService.csproj --no-restore --configuration Release
        elif [ "${{ matrix.service }}" = "swipe-service" ]; then
          dotnet build SwipeService.csproj --no-restore --configuration Release
        elif [ "${{ matrix.service }}" = "photo-service" ]; then
          dotnet build PhotoService.csproj --no-restore --configuration Release
        elif [ "${{ matrix.service }}" = "messaging-service" ]; then
          dotnet build MessagingService.csproj --no-restore --configuration Release
        else
          dotnet build --no-restore --configuration Release
        fi
    
    - name: Run unit tests with coverage
      run: |
        cd ${{ matrix.service }}
        # Find test projects
        if ls *.Tests/*.csproj 1> /dev/null 2>&1; then
          dotnet test *.Tests/*.csproj \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          
          echo "📊 Test coverage collected for ${{ matrix.service }}"
        else
          echo "⏭️  No test project found for ${{ matrix.service }}"
        fi
    
    - name: Generate coverage summary
      if: success()
      run: |
        cd ${{ matrix.service }}
        if [ -d "coverage" ]; then
          coverage_file=$(find coverage -name "coverage.cobertura.xml" | head -1)
          if [ -f "$coverage_file" ]; then
            line_rate=$(grep -oP 'line-rate="\K[0-9.]+' "$coverage_file" | head -1)
            branch_rate=$(grep -oP 'branch-rate="\K[0-9.]+' "$coverage_file" | head -1)
            line_pct=$(echo "$line_rate * 100" | bc -l | xargs printf "%.1f")
            branch_pct=$(echo "$branch_rate * 100" | bc -l | xargs printf "%.1f")
            echo "### 📊 ${{ matrix.service }} Coverage" >> $GITHUB_STEP_SUMMARY
            echo "- Line Coverage: ${line_pct}%" >> $GITHUB_STEP_SUMMARY
            echo "- Branch Coverage: ${branch_pct}%" >> $GITHUB_STEP_SUMMARY
          fi
        fi
    
    - name: Enforce coverage threshold (80%)
      if: success()
      continue-on-error: true
      run: |
        cd ${{ matrix.service }}
        if [ -d "coverage" ]; then
          coverage_file=$(find coverage -name "coverage.cobertura.xml" | head -1)
          if [ -f "$coverage_file" ]; then
            line_rate=$(grep -oP 'line-rate="\K[0-9.]+' "$coverage_file" | head -1)
            line_pct=$(echo "$line_rate * 100" | bc -l | xargs printf "%.1f")
            
            # Threshold: 10% line coverage (non-blocking, path to 80%: 10→20→40→60→80)
            threshold=10.0
            
            if (( $(echo "$line_pct < $threshold" | bc -l) )); then
              echo "⚠️  Coverage below threshold: ${line_pct}% < ${threshold}%"
              echo "::warning::${{ matrix.service }} line coverage (${line_pct}%) is below the target ${threshold}%"
            else
              echo "✅ Coverage: ${line_pct}% (target: 80%)"
            fi
          else
            echo "⚠️  No coverage file found - skipping threshold check"
          fi
        else
          echo "⏭️  No coverage directory - skipping threshold check"
        fi
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: success()
      continue-on-error: true
      with:
        files: ./${{ matrix.service }}/coverage/**/coverage.cobertura.xml
        flags: ${{ matrix.service }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # ===== GATEWAY BUILD =====
  gateway-build:
    name: Build YARP Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout main repo
      uses: actions/checkout@v4
    
    - name: Checkout dejting-yarp
      uses: actions/checkout@v4
      with:
        repository: best-koder-org/dejting-yarp
        path: dejting-yarp
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Build gateway
      run: |
        cd dejting-yarp/src/dejting-yarp
        dotnet restore dejting-yarp.csproj
        dotnet build dejting-yarp.csproj --no-restore --configuration Release

  # ===== SMOKE TESTS =====
  smoke-tests:
    name: API Smoke Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [dotnet-build-test, gateway-build]
    continue-on-error: true  # Don't fail CI on container timing issues
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: datingapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      keycloak:
        image: quay.io/keycloak/keycloak:23.0
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KC_DB: dev-mem
        ports:
          - 9090:8080
        options: >-
          --health-cmd="curl -f http://localhost:8080/health || exit 1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies
      run: |
        pip install httpx pydantic python-dotenv
    
    - name: Start services (background)
      env:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__DefaultConnection: "Server=localhost;Port=3306;Database=datingapp_test;User=root;Password=testpassword"
      run: |
        echo "🚀 Starting backend services..."
        
        # Start UserService (8082)
        cd UserService
        dotnet run --urls="http://localhost:8082" > ../user-service.log 2>&1 &
        echo $! > ../user-service.pid
        cd ..
        
        # Start MatchmakingService (8083)
        cd MatchmakingService
        dotnet run --urls="http://localhost:8083" > ../matchmaking-service.log 2>&1 &
        echo $! > ../matchmaking-service.pid
        cd ..
        
        # Start SwipeService (8084)
        cd swipe-service
        dotnet run --urls="http://localhost:8084" > ../swipe-service.log 2>&1 &
        echo $! > ../swipe-service.pid
        cd ..
        
        # Start PhotoService (8085)
        cd photo-service
        dotnet run --urls="http://localhost:8085" > ../photo-service.log 2>&1 &
        echo $! > ../photo-service.pid
        cd ..
        
        # Start MessagingService (8086)
        cd messaging-service
        dotnet run --urls="http://localhost:8086" > ../messaging-service.log 2>&1 &
        echo $! > ../messaging-service.pid
        cd ..
        
        echo "⏳ Services starting in background..."
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running comprehensive API smoke tests..."
        python3 smoke-tests.py
    
    - name: Display service logs on failure
      if: failure()
      run: |
        echo "📋 Service logs:"
        for log in *.log; do
          if [ -f "$log" ]; then
            echo "=== $log ==="
            tail -50 "$log"
          fi
        done
    
    - name: Cleanup services
      if: always()
      run: |
        echo "🛑 Stopping services..."
        for pidfile in *.pid; do
          if [ -f "$pidfile" ]; then
            kill $(cat "$pidfile") 2>/dev/null || true
            rm "$pidfile"
          fi
        done

  # ===== DOCKER BUILD =====
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service: [UserService, MatchmakingService, swipe-service, photo-service, messaging-service, dejting-yarp]
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===== SUMMARY =====
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [dotnet-build-test, gateway-build, smoke-tests]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ .NET Build & Test: ${{ needs.dotnet-build-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Gateway Build: ${{ needs.gateway-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Smoke Tests: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

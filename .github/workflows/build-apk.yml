name: Build Flutter APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target backend (prod/test/dev)'
        required: true
        type: choice
        options: [prod, test, dev]
        default: 'prod'

jobs:
  build-apk:
    name: Build APK (${{ inputs.environment || 'prod' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure backend URL
        run: |
          cd mobile-apps/flutter/dejtingapp
          ENV="${{ inputs.environment || 'prod' }}"
          case "$ENV" in
            prod)
              BASE_URL="https://prod.datingapp.example.com"
              ;;
            test)
              BASE_URL="https://test.datingapp.example.com"
              ;;
            dev)
              BASE_URL="https://dev.datingapp.example.com"
              ;;
          esac
          echo "Configuring app for $ENV: $BASE_URL"

          # Update the base URL in the app config
          cat >> android/key.properties << EOF
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
EOF

      - name: Build APK
        run: |
          cd mobile-apps/flutter/dejtingapp
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-x64

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile-apps/flutter/dejtingapp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile-apps/flutter/dejtingapp/build/app/outputs/flutter-apk/app-x86_64-release.apk
          fail_on_unmatched_files: false

      - name: Upload APK as Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: dejtingapp-${{ inputs.environment || 'prod' }}-apk
          path: mobile-apps/flutter/dejtingapp/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Generate download page
        run: |
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          ENV="${{ inputs.environment || 'prod' }}"

          mkdir -p dist
          cat > dist/index.html << HTML
          <!DOCTYPE html>
          <html>
          <head><title>DatingApp $ENV APK Download</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body { font-family: system-ui; max-width: 400px; margin: 2em auto; padding: 1em; }
            .btn { display: block; padding: 1em; margin: 0.5em 0; background: #FF7F50;
                   color: white; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold; }
            .info { color: #888; font-size: 0.9em; }
          </style></head>
          <body>
            <h1>📱 DatingApp $ENV</h1>
            <p class="info">Version: $VERSION | Built: $BUILD_DATE</p>
            <a class="btn" href="./app-arm64-v8a-release.apk">📥 Download ARM64 APK</a>
            <a class="btn" href="./app-x86_64-release.apk">📥 Download x86_64 APK</a>
            <p class="info">ARM64 for phones, x86_64 for emulators.</p>
            <p class="info">Enable "Install from unknown sources" in Android settings.</p>
          </body>
          </html>
          HTML
          echo "Download page generated"

      - name: Upload download page
        uses: actions/upload-artifact@v4
        with:
          name: download-page
          path: dist/
          retention-days: 30

# Auto-labeling configuration for PRs
# Docs: https://github.com/actions/labeler

# Service labels
'service:user':
  - changed-files:
    - any-glob-to-any-file: 'UserService/**'

'service:matchmaking':
  - changed-files:
    - any-glob-to-any-file: 'MatchmakingService/**'

'service:swipe':
  - changed-files:
    - any-glob-to-any-file: 'swipe-service/**'

'service:photo':
  - changed-files:
    - any-glob-to-any-file: 'photo-service/**'

'service:messaging':
  - changed-files:
    - any-glob-to-any-file: 'messaging-service/**'

'gateway':
  - changed-files:
    - any-glob-to-any-file: 'dejting-yarp/**'

# Type labels
'type:ci':
  - changed-files:
    - any-glob-to-any-file: '.github/**'

'type:docs':
  - changed-files:
    - any-glob-to-any-file: 
      - '**/*.md'
      - 'docs/**'

'type:tests':
  - changed-files:
    - any-glob-to-any-file: '**/*Tests/**'

'type:infrastructure':
  - changed-files:
    - any-glob-to-any-file:
      - 'infrastructure/**'
      - '**/*.sh'
      - 'docker-compose*.yml'

'type:security':
  - changed-files:
    - any-glob-to-any-file:
      - '**/SecurityConfig.cs'
      - '**/AuthenticationHandler.cs'

# Size labels (auto-generated by GitHub based on lines changed)

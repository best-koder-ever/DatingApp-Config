# Dating App Demo Environment
# Standardized configuration following Environment Strategy
# All services use port 80 internally, external ports via .env.demo
version: '3.8'

services:
  # MySQL Database - Demo
  mysql-demo:
    image: mysql:8.0
    container_name: dating-mysql-demo
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
      - ./init-demo-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - dating-demo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # YARP Gateway - Demo
  gateway-demo:
    build: ../../dejting-yarp
    container_name: dating-gateway-demo
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENV_NAME}
      - ASPNETCORE_URLS=http://+:80
      - Kestrel__Endpoints__Http__Url=http://+:80
    ports:
      - "${GATEWAY_PORT}:80"
    depends_on:
      - auth-service-demo
      - user-service-demo
      - matchmaking-service-demo
    networks:
      - dating-demo-network

  # Auth Service - Demo
  auth-service-demo:
    build: ../../AuthService
    container_name: dating-auth-demo
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENV_NAME}
      - ASPNETCORE_URLS=http://+:80
      - Kestrel__Endpoints__Http__Url=http://+:80
      - ConnectionStrings__DefaultConnection=Server=mysql-demo;Database=auth_service_demo;Uid=root;Pwd=${DB_ROOT_PASSWORD};
    ports:
      - "${AUTH_PORT}:80"
    depends_on:
      mysql-demo:
        condition: service_healthy
    networks:
      - dating-demo-network

  # User Service - Demo  
  user-service-demo:
    build: ../../UserService
    container_name: dating-user-demo
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENV_NAME}
      - ASPNETCORE_URLS=http://+:80
      - Kestrel__Endpoints__Http__Url=http://+:80
      - ConnectionStrings__DefaultConnection=Server=mysql-demo;Database=user_service_demo;Uid=root;Pwd=${DB_ROOT_PASSWORD};
    ports:
      - "${USER_PORT}:80"
    depends_on:
      mysql-demo:
        condition: service_healthy
    networks:
      - dating-demo-network

  # Matchmaking Service - Demo
  matchmaking-service-demo:
    build: ../../MatchmakingService
    container_name: dating-matchmaking-demo
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENV_NAME}
      - ASPNETCORE_URLS=http://+:80
      - Kestrel__Endpoints__Http__Url=http://+:80
      - ConnectionStrings__DefaultConnection=Server=mysql-demo;Database=matchmaking_service_demo;Uid=root;Pwd=${DB_ROOT_PASSWORD};
    ports:
      - "${MATCHMAKING_PORT}:80"
    depends_on:
      mysql-demo:
        condition: service_healthy
    networks:
      - dating-demo-network

volumes:
  mysql_demo_data:
    name: dating_demo_mysql_data

networks:
  dating-demo-network:
    name: dating-demo-network
    driver: bridge

<!DOCTYPE html>

<html class="dark" lang="sv"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aura Chat - Blind Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-fixed-variant": "#540062",
                        "on-error": "#490013",
                        "surface-dim": "#100d17",
                        "secondary-fixed-dim": "#b7c0ff",
                        "on-surface-variant": "#afa8b7",
                        "on-secondary-fixed": "#10268d",
                        "error": "#ff6e84",
                        "secondary": "#8596ff",
                        "inverse-primary": "#9b26af",
                        "inverse-surface": "#fef7ff",
                        "tertiary-container": "#f5d1fb",
                        "secondary-fixed": "#c9cfff",
                        "on-error-container": "#ffb2b9",
                        "outline-variant": "#4a4652",
                        "tertiary": "#fde3ff",
                        "primary-fixed-dim": "#db65ec",
                        "primary": "#f183ff",
                        "surface-container-high": "#221d2b",
                        "on-secondary": "#001367",
                        "secondary-dim": "#8596ff",
                        "background": "#100d17",
                        "surface-tint": "#f183ff",
                        "primary-dim": "#e46df5",
                        "on-secondary-fixed-variant": "#3447ab",
                        "primary-fixed": "#ea73fb",
                        "on-tertiary-fixed-variant": "#6a4e71",
                        "surface-bright": "#2f2a3a",
                        "secondary-container": "#293ca0",
                        "on-primary-fixed": "#010002",
                        "inverse-on-surface": "#58535f",
                        "surface-container": "#1b1824",
                        "on-background": "#f6eefd",
                        "tertiary-dim": "#e7c3ed",
                        "on-surface": "#f6eefd",
                        "on-primary-container": "#41004c",
                        "error-container": "#a70138",
                        "on-primary": "#540062",
                        "surface-variant": "#282332",
                        "surface": "#100d17",
                        "error-dim": "#d73357",
                        "tertiary-fixed": "#f5d1fb",
                        "surface-container-low": "#15121d",
                        "on-secondary-container": "#c7cdff",
                        "surface-container-highest": "#282332",
                        "tertiary-fixed-dim": "#e7c3ed",
                        "on-tertiary": "#694d70",
                        "on-tertiary-container": "#604567",
                        "on-tertiary-fixed": "#4c3253",
                        "primary-container": "#e770f8",
                        "outline": "#797380",
                        "surface-container-lowest": "#000000"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .waveform-bar {
            width: 3px;
            border-radius: 99px;
            background-color: currentColor;
            margin: 0 1px;
        }
        .glass-card {
            background: rgba(40, 35, 50, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(241, 131, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#100d17]/60 backdrop-blur-xl shadow-[0px_4px_30px_rgba(156,39,176,0.1)]">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center p-[2px]">
<div class="w-full h-full rounded-full bg-surface-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</div>
<h1 class="font-headline font-bold text-lg tracking-tight text-white uppercase">Maja</h1>
</div>
</div>
<div class="bg-primary-container/20 border border-primary/30 px-3 py-1 rounded-full">
<span class="text-xs font-headline font-bold text-primary tracking-widest">BLIND</span>
</div>
</div>
</header>
<!-- Reveal Indicator Section -->
<section class="mt-20 px-6 py-4 flex flex-col items-center gap-3">
<div class="w-full max-w-md">
<div class="flex justify-between items-end mb-2">
<span class="text-primary font-headline font-medium text-sm tracking-wide uppercase">8 av 15 meddelanden</span>
<span class="text-on-surface-variant text-xs font-body italic">53%</span>
</div>
<!-- 3-Segment Progress Bar logic applied to reveal indicator -->
<div class="h-1.5 w-full bg-surface-container-highest rounded-full flex gap-1 overflow-hidden p-[2px]">
<div class="h-full w-[53%] bg-gradient-to-r from-primary to-primary-container rounded-full shadow-[0_0_10px_rgba(241,131,255,0.4)]"></div>
<div class="h-full flex-1 bg-outline-variant/20 rounded-full"></div>
</div>
<p class="mt-3 text-center text-on-surface-variant/80 text-[11px] uppercase tracking-[0.2em] font-label">
                Avslöja efter 15 meddelanden
            </p>
</div>
</section>
<!-- Chat Area -->
<main class="flex-1 overflow-y-auto px-6 py-8 flex flex-col gap-8 pb-32">
<!-- Received Voice Message -->
<div class="flex flex-col items-start max-w-[85%]">
<div class="bg-primary/10 rounded-2xl rounded-tl-none p-4 flex items-center gap-4 relative group">
<div class="absolute inset-0 bg-primary/5 blur-xl rounded-full -z-10 group-hover:bg-primary/10 transition-all"></div>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_0_15px_rgba(241,131,255,0.3)]">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<div class="flex items-end gap-[2px] h-6 text-primary/60">
<div class="waveform-bar h-2"></div>
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-3"></div>
<div class="waveform-bar h-5"></div>
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-2"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-3"></div>
<div class="waveform-bar h-4"></div>
</div>
<span class="text-xs font-label text-on-surface-variant ml-2">0:08</span>
</div>
</div>
<!-- Sent Text Message -->
<div class="flex flex-col items-end self-end max-w-[85%]">
<div class="bg-surface-container-highest rounded-2xl rounded-tr-none px-5 py-3.5 text-on-surface text-sm leading-relaxed">
                Haha, det låter fantastiskt! 😄
            </div>
</div>
<!-- Daily Question Card (Asymmetric Bento-like focal point) -->
<div class="w-full flex justify-center py-4">
<div class="glass-card w-full max-w-sm rounded-lg p-6 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent"></div>
<div class="flex flex-col items-center text-center gap-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">auto_awesome</span>
<span class="text-primary font-headline text-xs font-bold tracking-[0.2em] uppercase">Dagens fråga</span>
</div>
<h2 class="text-xl font-headline font-medium text-white px-2">Vad gör dig lyckligast?</h2>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center opacity-40">
<span class="material-symbols-outlined text-sm">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Sent Voice Message -->
<div class="flex flex-col items-end self-end max-w-[85%]">
<div class="bg-secondary-container/40 rounded-2xl rounded-tr-none p-4 flex items-center gap-4 border border-secondary/10">
<div class="flex items-end gap-[2px] h-6 text-secondary/60">
<div class="waveform-bar h-3"></div>
<div class="waveform-bar h-5"></div>
<div class="waveform-bar h-2"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-3"></div>
<div class="waveform-bar h-5"></div>
<div class="waveform-bar h-2"></div>
<div class="waveform-bar h-6"></div>
</div>
<span class="text-xs font-label text-on-secondary-container mr-2">0:15</span>
<button class="w-10 h-10 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-[0_0_15px_rgba(133,150,255,0.2)]">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
</div>
<!-- Received Text Message -->
<div class="flex flex-col items-start max-w-[85%]">
<div class="bg-surface-container rounded-2xl rounded-tl-none px-5 py-3.5 text-on-surface text-sm leading-relaxed">
                Jag älskar att vandra i fjällen 🏔️
            </div>
</div>
</main>
<!-- BottomNavBar / Input Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-[#100d17]/80 backdrop-blur-2xl shadow-[0_-10px_40px_rgba(241,131,255,0.15)] rounded-t-[40px]">
<div class="px-8 pb-10 pt-6 flex flex-col gap-6">
<div class="flex items-center gap-4">
<!-- Ghost Border Input -->
<div class="flex-1 relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/20 focus:ring-0 focus:border-primary text-on-surface placeholder:text-on-surface-variant/40 font-body text-sm py-3 transition-all" placeholder="Skriv ett meddelande..." type="text"/>
</div>
<!-- Secondary Send Button -->
<button class="text-on-surface-variant hover:text-white transition-colors p-2 active:scale-90 duration-150">
<span class="material-symbols-outlined text-2xl">send</span>
</button>
</div>
<!-- Main Voice Action Cluster -->
<div class="flex justify-center items-center gap-12">
<button class="flex items-center justify-center text-gray-400 p-4 hover:text-white transition-colors active:scale-90">
<span class="material-symbols-outlined text-2xl">keyboard</span>
</button>
<!-- Luminous Action Microphone -->
<button class="flex items-center justify-center bg-gradient-to-br from-[#f183ff] to-[#e770f8] text-on-primary rounded-full w-20 h-20 shadow-[0_0_35px_rgba(241,131,255,0.5)] active:scale-95 transition-transform duration-150 group">
<span class="material-symbols-outlined text-3xl font-bold" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
<div class="absolute inset-0 rounded-full bg-white/10 scale-0 group-active:scale-110 transition-transform duration-300"></div>
</button>
<button class="flex items-center justify-center text-gray-400 p-4 hover:text-white transition-colors active:scale-90">
<span class="material-symbols-outlined text-2xl">mood</span>
</button>
</div>
</div>
</footer>
<!-- Decorative Grain Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')] mix-blend-overlay"></div>
</body></html>

<style>

<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary overflow-hidden">
<!-- Background Layer with Particles -->
<div class="fixed inset-0 bg-ceremony z-0">
<!-- Manually placed sparkles for a ceremonial feel -->
<div class="sparkle-dot w-1 h-1 top-20 left-[10%]"></div>
<div class="sparkle-dot w-0.5 h-0.5 top-40 left-[80%]"></div>
<div class="sparkle-dot w-1.5 h-1.5 top-60 left-[25%]"></div>
<div class="sparkle-dot w-0.5 h-0.5 top-80 left-[60%]"></div>
<div class="sparkle-dot w-1 h-1 top-[90%] left-[15%]"></div>
<div class="sparkle-dot w-0.5 h-0.5 top-[15%] left-[50%]"></div>
<div class="sparkle-dot w-1 h-1 top-[70%] left-[85%]"></div>
</div>
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 w-full bg-transparent">
<button class="hover:opacity-80 transition-opacity scale-95 duration-200 text-[#f183ff]">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-['Space_Grotesk'] font-light tracking-tight text-[#f183ff] uppercase text-xl font-bold tracking-widest">Reveal Moment</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6 pt-20 pb-24">
<!-- Header Section -->
<div class="text-center mb-12">
<h2 class="text-4xl md:text-5xl font-headline font-bold text-on-surface mb-3 tracking-tight">Avslöjandets ögonblick</h2>
<p class="text-on-surface-variant text-lg font-medium opacity-80">Ni har delat 15 meddelanden</p>
</div>
<!-- The Reveal Focal Point -->
<div class="relative group mb-12">
<!-- Animated Gradient Ring -->
<div class="absolute -inset-4 rounded-full bg-gradient-to-tr from-primary via-primary-container to-secondary-container opacity-75 blur-md reveal-glow"></div>
<!-- Main Circular Frame -->
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full border-4 border-primary/30 p-2 overflow-hidden bg-surface-container">
<div class="w-full h-full rounded-full overflow-hidden relative">
<!-- The User Photo -->
<img alt="Maja" class="w-full h-full object-cover filter brightness-110 saturate-110" data-alt="Close-up portrait of a woman named Maja with soft warm lighting, cinematic depth of field, gentle smile, and soft focus edges representing a magical reveal" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCkqEk_xEVzp8S36GvaMAN4m9jP2SzB96S1rZGOAInM22Q6YJQkF_NVhMu2Yj4zWkMFjnwG5f4kyc5Vb53ZC5ZWokcCINBuRynCQ5xdbKVv2ZlkUkTRe_P2Sxbw-rqvnQ8BoncLQwTFUD2kg-DTp4-92eAsI5IThLy9GlUs0vBBTekCGbENSePliOXO8mm7BDNz7OFUX8z_H7eG9bWDnKUMhyXlIliRLt4eChUhbvzbNaSSCqvfZm_rCNM4dd0CSp3oigWTBCzCYbrt"/>
<!-- Reveal Overlay/Dissolve Effect -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-primary/20 mix-blend-overlay"></div>
<div class="absolute inset-0 opacity-40 bg-[radial-gradient(circle_at_center,_transparent_0%,_#100d17_100%)]"></div>
</div>
</div>
<!-- Identity Label -->
<div class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-center w-full">
<span class="text-3xl font-headline font-bold text-on-surface drop-shadow-lg">Maja, 28</span>
</div>
</div>
<!-- Match Stats Card -->
<div class="glass-card w-full max-w-md rounded-lg p-8 mb-10 flex flex-col gap-6">
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<div>
<p class="text-on-surface font-semibold text-lg leading-tight">23 röstmeddelanden utbytta</p>
<p class="text-on-surface-variant text-sm">En djupare kontakt</p>
</div>
</div>
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="calendar_today" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<div>
<p class="text-on-surface font-semibold text-lg leading-tight">5 dagars konversation</p>
<p class="text-on-surface-variant text-sm">Tid väl spenderad</p>
</div>
</div>
<div class="flex items-center gap-5">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div>
<p class="text-on-surface font-semibold text-lg leading-tight">92% kompatibilitet</p>
<p class="text-on-surface-variant text-sm">Matchade intressen</p>
</div>
</div>
</div>

<div class="w-full max-w-md flex flex-col gap-4">
<button class="w-full py-5 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-xl shadow-[0_10px_40px_rgba(241,131,255,0.3)] hover:scale-[1.02] active:scale-95 transition-all duration-300">
                Fortsätt chatta
            </button>
<button class="w-full py-2 text-on-surface-variant font-medium hover:text-on-surface transition-colors">
                Pausa konversationen

</main>
<!-- Bottom Navigation Shell (Suppressed for transactional reveal focus but included as requested by system logic for Top Level if needed - though here suppressed via relevance check for 'Reveal') -->

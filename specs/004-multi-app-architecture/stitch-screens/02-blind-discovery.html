<!DOCTYPE html>

<html class="dark" lang="sv"><head>

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-card {
        background: rgba(27, 24, 36, 0.4);
        backdrop-filter: blur(12px);
      }
      .active-glow {
        box-shadow: 0 0 20px rgba(241, 131, 255, 0.4);
      }
      .neon-text-glow {
        text-shadow: 0 0 10px rgba(241, 131, 255, 0.5);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 flex items-center justify-between px-6 py-4 bg-gradient-to-b from-[#100d17] to-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-fuchsia-400" data-icon="graphic_eq">graphic_eq</span>
<h1 class="text-2xl font-bold text-fuchsia-400 tracking-tighter font-headline neon-text-glow">Voice</h1>
</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-fuchsia-400" data-icon="tune">tune</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-6 flex flex-col items-center justify-center space-y-8 pb-32">
<!-- Hero Card (Discovery Center) -->
<section class="w-full flex flex-col items-center">
<!-- Silhouette Avatar -->
<div class="relative group">
<div class="w-56 h-56 rounded-full bg-gradient-to-br from-secondary-container to-surface-container-highest flex items-center justify-center p-1 shadow-[0_0_50px_-10px_rgba(41,60,160,0.3)]">
<div class="w-full h-full rounded-full overflow-hidden bg-surface-container flex items-center justify-center">
<img alt="Anonymous profile silhouette" class="w-full h-full object-cover mix-blend-lighten opacity-60" data-alt="Mysterious deep purple and indigo gradient silhouette of a person on a dark atmospheric background with soft cinematic lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6fcP7wIqjuXzi88Vz6md1ZQV7y1a38K2p1iosCh1DdFx3hMLJmSX378ogM3GcS7MU6HMJwwqcEYf7H5VZdnlnskYSoIyyuPMzfcKZAL1CXyfi6JfZVk-Cmb5HVVp2j_vlOIHCaE5jMVyHrBAInLVs1lB0bz4t3H707EB_ZGlXAnmLi-4iM3HS0jij7KdBefMi12_O6eCKHvYURVZ8tD7uHUWu9PWKCpsoHPxCL7z-mYYsLzH_sWD1DxVFcgRIiWwNn0iTxmYF3T1r"/>
</div>
</div>
<!-- Status indicator -->
<div class="absolute bottom-4 right-4 w-4 h-4 bg-primary rounded-full border-4 border-surface shadow-[0_0_10px_rgba(241,131,255,0.8)]"></div>
</div>
<!-- Profile Identity -->
<div class="mt-6 text-center">
<h2 class="text-3xl font-bold font-headline tracking-tight text-on-surface">Maja, 28</h2>
<div class="flex items-center justify-center gap-1 mt-1 text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="location_on">location_on</span>
<span class="text-sm font-medium">Stockholm</span>
</div>
</div>
<!-- Voice Prompt Cards -->
<div class="w-full mt-10 grid grid-cols-3 gap-3">
<!-- Prompt 1 -->
<button class="glass-card p-3 rounded-2xl flex flex-col items-start gap-2 border border-outline-variant/10 active:scale-95 transition-transform text-left">
<span class="text-[10px] font-bold uppercase tracking-wider text-primary opacity-80">Äventyr</span>
<div class="flex items-end gap-[2px] h-6 w-full">
<div class="w-1 bg-primary rounded-full h-2"></div>
<div class="w-1 bg-primary rounded-full h-4"></div>
<div class="w-1 bg-primary rounded-full h-5"></div>
<div class="w-1 bg-primary/40 rounded-full h-3"></div>
<div class="w-1 bg-primary/40 rounded-full h-1"></div>
<div class="w-1 bg-primary/40 rounded-full h-2"></div>
</div>
<div class="flex items-center justify-between w-full mt-1">
<span class="text-[10px] text-on-surface-variant">0:12</span>
<span class="material-symbols-outlined text-xs text-primary" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</button>
<!-- Prompt 2 (Active state simulation) -->
<button class="bg-primary/10 p-3 rounded-2xl flex flex-col items-start gap-2 border border-primary/20 active:scale-95 transition-transform text-left">
<span class="text-[10px] font-bold uppercase tracking-wider text-primary">Favoritplats</span>
<div class="flex items-end gap-[2px] h-6 w-full">
<div class="w-1 bg-primary rounded-full h-1"></div>
<div class="w-1 bg-primary rounded-full h-3"></div>
<div class="w-1 bg-primary rounded-full h-6"></div>
<div class="w-1 bg-primary rounded-full h-4"></div>
<div class="w-1 bg-primary rounded-full h-5"></div>
<div class="w-1 bg-primary rounded-full h-2"></div>
</div>
<div class="flex items-center justify-between w-full mt-1">
<span class="text-[10px] text-primary">0:15</span>
<span class="material-symbols-outlined text-xs text-primary" data-icon="pause" style="font-variation-settings: 'FILL' 1;">pause</span>
</div>
</button>
<!-- Prompt 3 -->
<button class="glass-card p-3 rounded-2xl flex flex-col items-start gap-2 border border-outline-variant/10 active:scale-95 transition-transform text-left">
<span class="text-[10px] font-bold uppercase tracking-wider text-primary opacity-80">Hemlighet</span>
<div class="flex items-end gap-[2px] h-6 w-full">
<div class="w-1 bg-primary/40 rounded-full h-3"></div>
<div class="w-1 bg-primary/40 rounded-full h-1"></div>
<div class="w-1 bg-primary/40 rounded-full h-4"></div>
<div class="w-1 bg-primary/40 rounded-full h-5"></div>
<div class="w-1 bg-primary/40 rounded-full h-2"></div>
<div class="w-1 bg-primary/40 rounded-full h-4"></div>
</div>
<div class="flex items-center justify-between w-full mt-1">
<span class="text-[10px] text-on-surface-variant">0:08</span>
<span class="material-symbols-outlined text-xs text-primary" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</button>
</div>
</section>
<!-- Action Buttons Section -->
<section class="w-full flex flex-col items-center gap-4">
<div class="flex items-center gap-8">
<!-- Pass Button -->
<button class="w-14 h-14 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant hover:border-error hover:text-error transition-all active:scale-90">
<span class="material-symbols-outlined text-2xl" data-icon="close">close</span>
</button>
<!-- Primary Voice Action -->
<button class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-on-primary shadow-[0_0_30px_rgba(241,131,255,0.4)] hover:shadow-[0_0_45px_rgba(241,131,255,0.6)] transition-all active:scale-90">
<span class="material-symbols-outlined text-4xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Superlike Button -->
<button class="w-14 h-14 rounded-full border border-primary/30 flex items-center justify-center text-primary hover:bg-primary/10 transition-all active:scale-90">
<span class="material-symbols-outlined text-2xl" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</button>
</div>
<p class="text-xs font-medium text-on-surface-variant/60 tracking-widest uppercase">Lyssna först</p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-10 bg-[#100d17]/60 backdrop-blur-xl">
<div class="fixed bottom-6 left-6 right-6 rounded-full border border-fuchsia-500/10 h-20 flex justify-around items-center px-4 shadow-[0_0_40px_-5px_rgba(241,131,255,0.15)] bg-[#100d17]/40">
<!-- Discovery (Active) -->
<a class="flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-br from-fuchsia-400 to-purple-500 shadow-[0_0_20px_rgba(241,131,255,0.4)] text-white hover:scale-110 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="explore" style="font-variation-settings: 'FILL' 1;">explore</span>
</a>
<!-- Matches -->
<a class="flex items-center justify-center w-12 h-12 text-slate-400 hover:scale-110 hover:text-fuchsia-300 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
</a>
<!-- Messages -->
<a class="flex items-center justify-center w-12 h-12 text-slate-400 hover:scale-110 hover:text-fuchsia-300 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="forum">forum</span>
</a>
<!-- Profile -->
<a class="flex items-center justify-center w-12 h-12 text-slate-400 hover:scale-110 hover:text-fuchsia-300 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
</a>
</div>
</nav>
</body></html>

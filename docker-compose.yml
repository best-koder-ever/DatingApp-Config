services:
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8090:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - app-network

  yarp:
    image: yarp:latest
    build:
      context: ./dejting-yarp
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - matchmaking-service
      - swipe-service
      - photo-service
      - messaging-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8080
      - ASPNETCORE_URLS=http://*:8080     
    networks:
      - app-network

  auth-service:
    image: auth-service:latest  
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8081
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_URLS=http://*:8081
      - ConnectionStrings__DefaultConnection=Server=AuthService-db;Port=3306;Database=AuthServiceDb;User=authuser;Password=authuser_password;
      - DEMO_MODE=${DEMO_MODE:-false}
    depends_on:
      AuthService-db:
        condition: service_healthy
    networks:
      - app-network

  AuthService-db:
    image: mysql:8.0
    container_name: AuthService-db
    restart: always    
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: AuthServiceDb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authuser_password
    ports:
      - "3307:3306"
    volumes:
      - AuthService-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "AuthService-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    image: user-service:latest
    build:
      context: ./UserService
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8082
      - ASPNETCORE_HTTPS_PORTS=8082
      - ASPNETCORE_URLS=http://*:8082
      - ConnectionStrings__DefaultConnection=Server=UserService-db;Port=3306;Database=UserServiceDb;User=userservice_user;Password=userservice_user_password;  
      - DEMO_MODE=${DEMO_MODE:-false}  
    depends_on:
      - UserService-db
    networks:
      - app-network

  UserService-db:
    image: mysql:8.0
    container_name: UserService-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: UserServiceDb
      MYSQL_USER: userservice_user
      MYSQL_PASSWORD: userservice_user_password
    ports:
      - "3308:3306"
    volumes:
      - UserService-data:/var/lib/mysql
    networks:
      - app-network  
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "UserService-db"]
      interval: 10s
      timeout: 5s
      retries: 5      

  matchmaking-service:
    image: matchmaking-service:latest
    build:
      context: .
      dockerfile: ./MatchmakingService/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8083
      - ASPNETCORE_HTTPS_PORTS=8083
      - ASPNETCORE_URLS=http://*:8083
      - ConnectionStrings__DefaultConnection=Server=MatchmakingService-db;Port=3306;Database=MatchmakingServiceDb;User=matchmakingservice_user;Password=matchmakingservice_user_password;  
      - DEMO_MODE=${DEMO_MODE:-false}  
    depends_on:
      - MatchmakingService-db
    networks:
      - app-network

  MatchmakingService-db:
    image: mysql:8.0
    container_name: MatchmakingService-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: MatchmakingServiceDb
      MYSQL_USER: matchmakingservice_user
      MYSQL_PASSWORD: matchmakingservice_user_password
    ports:
      - "3309:3306"
    volumes:
      - MatchmakingService-data:/var/lib/mysql
    networks:
      - app-network  
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "MatchmakingService-db"]
      interval: 10s
      timeout: 5s
      retries: 5     

  swipe-service:
    image: swipe-service:latest
    build:
      context: ./swipe-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8086
      - ASPNETCORE_HTTPS_PORTS=8086
      - ASPNETCORE_URLS=http://*:8086
      - ConnectionStrings__DefaultConnection=Server=swipe-service-db;Port=3306;Database=SwipeServiceDb;User=swipeservice_user;Password=swipeservice_user_password;
    depends_on:
      - swipe-service-db
    networks:
      - app-network

  swipe-service-db:
    image: mysql:8.0
    container_name: swipe-service-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: SwipeServiceDb
      MYSQL_USER: swipeservice_user
      MYSQL_PASSWORD: swipeservice_user_password
    ports:
      - "3310:3306"
    volumes:
      - swipe-service-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "swipe-service-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  photo-service:
    image: photo-service:latest
    build:
      context: ./photo-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"  # FIXED: Match dev-start port
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8085  # FIXED: Match dev-start port
      - ConnectionStrings__DefaultConnection=Server=photo-service-db;Port=3306;Database=PhotoServiceDb;User=photoservice_user;Password=photoservice_user_password;
      - JwtSettings__SecretKey=your-super-secret-key-that-is-at-least-32-characters-long-for-security
      - JwtSettings__Issuer=DatingApp
      - JwtSettings__Audience=DatingApp-Users
      - Storage__PhotosPath=/app/wwwroot/uploads/photos
    depends_on:
      photo-service-db:
        condition: service_healthy
    volumes:
      - photo-storage:/app/wwwroot/uploads/photos
    networks:
      - app-network

  photo-service-db:
    image: mysql:8.0
    container_name: photo-service-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: PhotoServiceDb
      MYSQL_USER: photoservice_user
      MYSQL_PASSWORD: photoservice_user_password
    command: --sql-mode="ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION" --explicit_defaults_for_timestamp=1
    ports:
      - "3311:3306"
    volumes:
      - photo-service-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "photo-service-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  messaging-service:
    image: messaging-service:latest
    build:
      context: ./messaging-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"  # FIXED: Match dev-start port and avoid conflict
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8086  # FIXED: Match dev-start port
      - ConnectionStrings__DefaultConnection=Server=messaging-service-db;Port=3306;Database=MessagingServiceDb;User=messagingservice_user;Password=messagingservice_user_password;
      - Jwt__Key=your-super-secret-key-that-is-at-least-32-characters-long-for-security
    depends_on:
      messaging-service-db:
        condition: service_healthy
    networks:
      - app-network

  messaging-service-db:
    image: mysql:8.0
    container_name: messaging-service-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: MessagingServiceDb
      MYSQL_USER: messagingservice_user
      MYSQL_PASSWORD: messagingservice_user_password
    ports:
      - "3312:3306"
    volumes:
      - messaging-service-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "messaging-service-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    ports:
      - "8087:80"
    environment:
      ACCEPT_EULA: Y
    volumes:
      - seq-data:/data
    networks:
      - app-network

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/tmp/loki
    networks:
      - app-network
    user: "root"

  promtail:
    image: grafana/promtail:2.4.1
    volumes:
      - /var/log:/var/log
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app-network

  test-data-generator:
    build:
      context: . # Changed from ./TestDataGenerator
      dockerfile: ./TestDataGenerator/Dockerfile # Specified Dockerfile path
    depends_on:
      - auth-service
    networks:
      - app-network
    environment:
      - AUTH_API_URL=http://auth-service:8081
    command: ["dotnet", "TestDataGenerator.dll"]

  debug:
    image: ubuntu:22.04
    command: ["sleep", "infinity"]
    networks:
      - app-network
    tty: true
    stdin_open: true

volumes:
  keycloak-db-data:
  loki-data:
  AuthService-data:
  UserService-data:
  MatchmakingService-data:
  swipe-service-data:
  photo-service-data:
  photo-storage:
  messaging-service-data:
  seq-data:
  grafana-storage:

networks:
  app-network:
    driver: bridge
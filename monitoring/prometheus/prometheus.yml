global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dating-app-mvp'
    environment: 'development'

# Alertmanager configuration (optional for now)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # ===== BACKEND SERVICES - OpenTelemetry Metrics =====
  
  # User Service - Profile management
  - job_name: 'user-service'
    static_configs:
      - targets: ['host.docker.internal:8082']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Matchmaking Service - Match algorithm
  - job_name: 'matchmaking-service'
    static_configs:
      - targets: ['host.docker.internal:8083']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Swipe Service - Swipe processing
  - job_name: 'swipe-service'
    static_configs:
      - targets: ['host.docker.internal:8084']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Photo Service - Photo upload and moderation
  - job_name: 'photo-service'
    static_configs:
      - targets: ['host.docker.internal:8085']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Messaging Service - Real-time messaging
  - job_name: 'messaging-service'
    static_configs:
      - targets: ['host.docker.internal:8086']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Auth Service - Authentication and JWT issuance
  - job_name: 'auth-service'
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # ===== INFRASTRUCTURE =====
  
  # YARP Gateway - API Gateway metrics
  - job_name: 'yarp-gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # ===== HEALTH CHECKS (for uptime monitoring) =====
  
  # Service health endpoints
  - job_name: 'health-checks'
    static_configs:
      - targets: 
        - 'host.docker.internal:8081'  # Auth Service
        - 'host.docker.internal:8082'  # User Service
        - 'host.docker.internal:8083'  # Matchmaking Service
        - 'host.docker.internal:8084'  # Swipe Service
        - 'host.docker.internal:8085'  # Photo Service
        - 'host.docker.internal:8086'  # Messaging Service
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 5s

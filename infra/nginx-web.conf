# nginx config for the Flutter web build.
#
# Serves the static `build/web` directory and falls back to /index.html so
# the Flutter router can take over. The Flutter app then makes CORS-aware
# XHR/fetch calls to the backend gateway (selected in-app: funnel/LAN).
#
# IMPORTANT caching rules for Flutter web:
#  - Content-hashed files under /assets/ and /canvaskit/ can be cached
#    forever (their names change on every rebuild).
#  - The entry/bootstrap files (index.html, flutter_bootstrap.js, main.dart.js,
#    flutter_service_worker.js) use FIXED filenames across rebuilds, so they
#    MUST be served no-cache — otherwise browsers keep the stale bundle after
#    `flutter build web` (this caused "old code still running" bugs).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets -> cache immutable forever.
    location ~* ^/(assets|canvaskit)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry files (fixed names) -> always revalidate.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|version\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Small static: favicon/icons/manifest can be cached briefly.
    location ~* ^/(favicon\.png|manifest\.json|icons/) {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything else: SPA fallback to index.html (no-cache).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
